name: Build Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the Linux artifact to"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach the Linux artifact to"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Build portable Linux app
        run: |
          npm run package:linux
          cd release
          zip -r Pokeke-linux-x64.zip Pokeke-linux-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeke-linux-x64
          path: release/Pokeke-linux-x64.zip
          if-no-files-found: error

      - name: Attach artifact to the release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" release/Pokeke-linux-x64.zip --clobber

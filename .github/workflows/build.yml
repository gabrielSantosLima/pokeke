name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the installer to (for example v0.1.0)"
        required: false
        default: ""
        type: string
      channel:
        description: "Release channel to build"
        required: true
        default: prod
        type: choice
        options:
          - dev
          - beta
          - prod
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach the installer to"
        required: false
        default: ""
        type: string
      channel:
        description: "Release channel to build"
        required: false
        default: prod
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Select build config
        id: config
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel || 'prod' }}
        run: |
          case "$CHANNEL" in
            dev) config="electron-builder.dev.yml" ; out="release-dev" ;;
            beta) config="electron-builder.beta.yml" ; out="release-beta" ;;
            *) config="electron-builder.yml" ; out="release" ;;
          esac
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "output=$out" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: npx electron-builder --config "${{ steps.config.outputs.config }}" --win --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeke-windows-${{ inputs.channel || 'prod' }}
          path: ${{ steps.config.outputs.output }}/*
          if-no-files-found: error

      - name: Attach installer to the release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          OUT: ${{ steps.config.outputs.output }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$OUT"/*.exe "$OUT"/*.blockmap "$OUT"/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows artifacts found for $TAG" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
